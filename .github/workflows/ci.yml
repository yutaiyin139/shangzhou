name: CI

# 阶段 5.4 持续集成：后端语法/编译校验 + 前端类型检查与构建
# 说明：完整 e2e 回归依赖已灌数据的 MySQL / Redis / Qdrant 与已配置的模型密钥，
#      不适合在无凭据的 CI 环境跑，故此处固化「可零依赖复现」的质量闸门。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端语法/编译校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 编译全部 .py（语法闸门，缺依赖不影响）
        run: python -m compileall -q .

      - name: 依赖清单存在性检查
        run: test -f requirements.txt && echo "requirements.txt OK"

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建（vue-tsc --noEmit && vite build）
        run: npm run build
